services:
  db:
    container_name: library-postgres
    image: postgres:16.3-alpine3.20
    ports:
      - "5455:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_DB_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01.sql
      - db_library_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres -U postgres"]
      interval: 5s
      timeout: 1s
      retries: 3
    networks:
      - library_network
    # profiles: ["db"]

  keycloak:
    container_name: library-keycloak
    image: quay.io/keycloak/keycloak:latest
    command:
      - start-dev
#      - --import-realm
    ports:
      - 5443:8080
    environment:
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB: ${KC_DB}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
#      KEYCLOAK_IMPORT: ./library-realm.json
    depends_on:
      - db
    networks:
      - library_network
    # profiles: [ "keycloak" ]

  minio:
    image: quay.io/minio/minio:latest
    container_name: library-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-storage:/data
      # - minio-config:/root/.minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # MINIO_DOMAIN: ${MINIO_DOMAIN}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS}
      # MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - library_network
    # profiles: [ "minio" ]

networks:
  library_network:
    name: library_network

volumes:
  db_library_data:
  minio-storage:
  minio-config:

