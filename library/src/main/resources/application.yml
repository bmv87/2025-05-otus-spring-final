spring:
  application:
    name: library
  profiles:
    active: dev
  data:
    rest:
      default-media-type: application/json
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/library
    username: postgres
    password: postgres
  sql:
    init:
      mode: never
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/data
  mvc:
    hiddenmethod:
      filter:
        enabled: true
logging:
  logging:
    level:
      root: debug
  file:
    name: ../logs/hw.log

cors:
  urls:


