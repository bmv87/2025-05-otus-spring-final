spring:
  datasource:
    url: jdbc:h2:mem:testdb
  sql:
    init:
      mode: never
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/testdata
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:5443/realms/library
logging:
  file:
    name: ../logs/hw_test.log
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE

cors:
  urls:

defaults:
  locale: ru-RU

minio:
  url: http://localhost:9000
  access-key: admin
  secret-key: admin123
  bucket-name: library
  image-size: 10485760
  file-size: 104857600
